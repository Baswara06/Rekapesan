name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  # Evaluasi ekstraktor ke LLM sungguhan. Hanya di main atau dijalankan manual, supaya kuota API hemat.
  # Butuh secrets LLM_BASE_URL, LLM_API_KEY, LLM_MODEL. Tanpa LLM_API_KEY langkah evaluasi dilewati dan job tetap hijau.
  evaluasi:
    needs: backend
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Evaluasi ekstraktor ke sample/gold.json
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "LLM_API_KEY belum diatur di Secrets, evaluasi dilewati." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m tests.eval.jalankan --json hasil-evaluasi.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: hashFiles('backend/hasil-evaluasi.json') != ''
        with:
          name: hasil-evaluasi
          path: backend/hasil-evaluasi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
